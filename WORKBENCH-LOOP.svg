<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="Verdana, Geneva, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1128"/><stop offset="1" stop-color="#101c40"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#ff8c1a"/>
    </marker>
  </defs>
  <rect width="1280" height="760" fill="url(#sky)"/>

  <text x="640" y="50" text-anchor="middle" fill="#eef3ff" font-size="28" font-weight="bold" letter-spacing="5">THE WORKBENCH LOOP</text>
  <text x="640" y="78" text-anchor="middle" fill="#8fa8e8" font-size="14" letter-spacing="2">GRAB → STAGE THE SIX BINS → BUILD → STAMP · the garage is the inventory</text>

  <!-- STEP 1: the garage floor -->
  <g>
    <rect x="30" y="120" width="380" height="440" fill="rgba(12,20,44,.9)" stroke="#2e6bff" stroke-width="1.5"/>
    <text x="220" y="150" text-anchor="middle" fill="#4d86ff" font-size="15" font-weight="bold" letter-spacing="3">1 · GRAB — WALK THE GARAGE</text>

    <!-- shelves layout -->
    <rect x="60" y="176" width="140" height="52" fill="none" stroke="#4d86ff" stroke-width="1"/>
    <text x="130" y="198" text-anchor="middle" fill="#b9c8f2" font-size="11">ENGINE SHELF</text>
    <text x="130" y="216" text-anchor="middle" fill="#7d92c9" font-size="10">blocks · cams · heads</text>

    <rect x="240" y="176" width="140" height="52" fill="none" stroke="#4d86ff" stroke-width="1"/>
    <text x="310" y="198" text-anchor="middle" fill="#b9c8f2" font-size="11">ELECTRICAL WALL</text>
    <text x="310" y="216" text-anchor="middle" fill="#7d92c9" font-size="10">wire · fuses · plugs</text>

    <rect x="60" y="252" width="140" height="52" fill="none" stroke="#4d86ff" stroke-width="1"/>
    <text x="130" y="274" text-anchor="middle" fill="#b9c8f2" font-size="11">TIRE RACK</text>
    <text x="130" y="292" text-anchor="middle" fill="#7d92c9" font-size="10">210/55 R14-S ...</text>

    <rect x="240" y="252" width="140" height="52" fill="none" stroke="#4d86ff" stroke-width="1"/>
    <text x="310" y="274" text-anchor="middle" fill="#b9c8f2" font-size="11">HARDWARE DRAWERS</text>
    <text x="310" y="292" text-anchor="middle" fill="#7d92c9" font-size="10">VM8×24 · washers · tape</text>

    <rect x="60" y="328" width="140" height="52" fill="none" stroke="#4d86ff" stroke-width="1"/>
    <text x="130" y="350" text-anchor="middle" fill="#b9c8f2" font-size="11">DRIVETRAIN CORNER</text>
    <text x="130" y="368" text-anchor="middle" fill="#7d92c9" font-size="10">GB-M5c · DF-LS</text>

    <rect x="240" y="328" width="140" height="52" fill="none" stroke="#ffa53d" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="310" y="350" text-anchor="middle" fill="#ffa53d" font-size="11">THE SHELF</text>
    <text x="310" y="368" text-anchor="middle" fill="#7d92c9" font-size="10">pre-standard relics ✨</text>

    <path d="M90 480 C 130 430, 100 300, 130 240" fill="none" stroke="#ff8c1a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arr)"/>
    <circle cx="90" cy="490" r="10" fill="#ff8c1a"/>
    <text x="112" y="495" fill="#ffa53d" font-size="11" font-weight="bold">you, walking</text>

    <text x="220" y="530" text-anchor="middle" fill="#7d92c9" font-size="11" font-style="italic">v1: a built 3D garage · someday: YOUR scanned garage,</text>
    <text x="220" y="548" text-anchor="middle" fill="#7d92c9" font-size="11" font-style="italic">your real bins, same loop</text>
  </g>

  <!-- arrow 1 -->
  <path d="M420 340 L 460 340" stroke="#ff8c1a" stroke-width="3" marker-end="url(#arr)"/>

  <!-- STEP 2: the bench + six bins -->
  <g>
    <rect x="470" y="120" width="380" height="440" fill="rgba(12,20,44,.9)" stroke="#ff8c1a" stroke-width="1.5"/>
    <text x="660" y="150" text-anchor="middle" fill="#ffa53d" font-size="15" font-weight="bold" letter-spacing="3">2 · STAGE — THE SIX BINS</text>

    <!-- bench top -->
    <rect x="500" y="180" width="320" height="150" fill="none" stroke="#8fa8e8" stroke-width="1.5"/>
    <text x="660" y="205" text-anchor="middle" fill="#b9c8f2" font-size="12" letter-spacing="2">B E N C H</text>

    <!-- six bins -->
    <g font-size="10" text-anchor="middle">
      <rect x="512" y="222" width="92" height="44" fill="rgba(46,107,255,.12)" stroke="#4d86ff"/>
      <text x="558" y="240" fill="#eef3ff">BIN 1</text><text x="558" y="256" fill="#8fa8e8">B-L2 2400</text>
      <rect x="614" y="222" width="92" height="44" fill="rgba(46,107,255,.12)" stroke="#4d86ff"/>
      <text x="660" y="240" fill="#eef3ff">BIN 2</text><text x="660" y="256" fill="#8fa8e8">CAM-R3</text>
      <rect x="716" y="222" width="92" height="44" fill="rgba(46,107,255,.12)" stroke="#4d86ff"/>
      <text x="762" y="240" fill="#eef3ff">BIN 3</text><text x="762" y="256" fill="#8fa8e8">pistons ×4</text>
      <rect x="512" y="274" width="92" height="44" fill="rgba(46,107,255,.12)" stroke="#4d86ff"/>
      <text x="558" y="292" fill="#eef3ff">BIN 4</text><text x="558" y="308" fill="#8fa8e8">T3-M turbo</text>
      <rect x="614" y="274" width="92" height="44" fill="rgba(46,107,255,.12)" stroke="#4d86ff"/>
      <text x="660" y="292" fill="#eef3ff">BIN 5</text><text x="660" y="308" fill="#8fa8e8">VM8×24 ×16</text>
      <rect x="716" y="274" width="92" height="44" fill="rgba(255,140,26,.12)" stroke="#ffa53d"/>
      <text x="762" y="292" fill="#eef3ff">BIN 6</text><text x="762" y="308" fill="#ffa53d">empty — forgot</text>
    </g>

    <text x="660" y="368" text-anchor="middle" fill="#b9c8f2" font-size="12">you build FROM the bins — what you didn't grab,</text>
    <text x="660" y="386" text-anchor="middle" fill="#b9c8f2" font-size="12">you don't have. walk back or improvise.</text>
    <text x="660" y="420" text-anchor="middle" fill="#7d92c9" font-size="11" font-style="italic">forgot the head gasket? that's a whole trip.</text>
    <text x="660" y="438" text-anchor="middle" fill="#7d92c9" font-size="11" font-style="italic">that trip is the game.</text>

    <text x="660" y="500" text-anchor="middle" fill="#ffa53d" font-size="12" font-weight="bold">fitment is law at the bench:</text>
    <text x="660" y="520" text-anchor="middle" fill="#b9c8f2" font-size="11">an M cam physically will not seat in an L head</text>
  </g>

  <!-- arrow 2 -->
  <path d="M860 340 L 900 340" stroke="#ff8c1a" stroke-width="3" marker-end="url(#arr)"/>

  <!-- STEP 3: build + stamp -->
  <g>
    <rect x="910" y="120" width="340" height="440" fill="rgba(12,20,44,.9)" stroke="#2e6bff" stroke-width="1.5"/>
    <text x="1080" y="150" text-anchor="middle" fill="#4d86ff" font-size="15" font-weight="bold" letter-spacing="3">3 · BUILD &amp; STAMP</text>

    <text x="1080" y="185" text-anchor="middle" fill="#b9c8f2" font-size="12">stack it · seat it · bolt it · torque it</text>
    <text x="1080" y="205" text-anchor="middle" fill="#b9c8f2" font-size="12">specs compute LIVE as parts land</text>

    <!-- the plate -->
    <rect x="950" y="240" width="260" height="180" fill="rgba(8,14,30,.9)" stroke="#ffa53d" stroke-width="2"/>
    <rect x="950" y="240" width="260" height="180" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1" transform="translate(0,0)" stroke-dasharray="none" x2="0"/>
    <text x="1080" y="272" text-anchor="middle" fill="#eef3ff" font-size="17" font-weight="bold" letter-spacing="1">"WIDOWMAKER"</text>
    <text x="1080" y="298" text-anchor="middle" fill="#ffa53d" font-size="15" font-weight="bold">L24T · 486 vp</text>
    <text x="1080" y="322" text-anchor="middle" fill="#8fa8e8" font-size="12">built by ADAM · season 1</text>
    <line x1="975" y1="338" x2="1185" y2="338" stroke="#2e6bff" stroke-width="1"/>
    <text x="1080" y="360" text-anchor="middle" fill="#b9c8f2" font-size="11">B-L2 2400 · CAM-R3 · T3-M</text>
    <text x="1080" y="380" text-anchor="middle" fill="#b9c8f2" font-size="11">2400 cc · 142 kg · heat 6.2</text>
    <text x="1080" y="402" text-anchor="middle" fill="#7d92c9" font-size="10" font-style="italic">designation EARNED, not chosen</text>

    <text x="1080" y="455" text-anchor="middle" fill="#b9c8f2" font-size="12">drop it in a kart · flex it in the shop</text>
    <text x="1080" y="475" text-anchor="middle" fill="#b9c8f2" font-size="12">sell it, someday — engineer fame</text>
    <text x="1080" y="520" text-anchor="middle" fill="#ffa53d" font-size="13" font-weight="bold" letter-spacing="1">40 ——— vp scale ——— 800+</text>
    <text x="1080" y="540" text-anchor="middle" fill="#7d92c9" font-size="10">lawnmower · club · serious · El Santo · cursed</text>
  </g>

  <!-- footer: store note -->
  <rect x="30" y="600" width="1220" height="110" fill="rgba(12,20,44,.6)" stroke="#4d86ff" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="640" y="632" text-anchor="middle" fill="#4d86ff" font-size="14" font-weight="bold" letter-spacing="2">THE PARTS STORE (locked: one big store, brand shelves)</text>
  <text x="640" y="658" text-anchor="middle" fill="#b9c8f2" font-size="12">One national catalogue organized by system — aisles like a real store — brands are shelves within each aisle · packs stay generic gambling</text>
  <text x="640" y="682" text-anchor="middle" fill="#7d92c9" font-size="11" font-style="italic">bought parts arrive at your garage shelving — which is why the walk exists</text>
</svg>
